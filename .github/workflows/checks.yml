name: Workbench checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  isolated-tests:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/readable_test.cjs
      - run: python -B scripts/launcher_test.py
      - run: python -B scripts/self_test.py
      - run: python -B scripts/date_consistency_test.py
      - run: python -B scripts/organization_time_test.py
      - run: python -B scripts/quality_test.py
      - run: python -B scripts/next_step_test.py
